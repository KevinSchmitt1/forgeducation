[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forged"
version = "0.1.0"
description = "A multi-agent CLI that builds and self-checks IT learning notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "forged contributors" }]
keywords = ["education", "notebooks", "agents", "llm", "jupyter"]

dependencies = [
    "openai>=1.45.0",      # OpenAI + Ollama client (needs max_completion_tokens support)
    "langfuse>=3.0.0",     # trace every LLM-backed agent prompt
    "pydantic>=2.0.0",     # config validation
    "pyyaml>=6.0",         # pipeline config files
    "nbformat>=5.10.0",    # assemble .ipynb
    "nbclient>=0.10.0",    # execute notebooks (the anti-bug layer)
    "ipykernel>=6.29.0",   # kernel for execution
    "langgraph>=1.0.0",    # LangGraph for agentic pipeline orchestration
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",          # lint + import sorting
    "mypy>=1.11.0",         # static type checking
    "types-PyYAML>=6.0",    # stubs for the yaml import
    "forged[ui]",           # so CI type-checks and tests the UI layer too
]
# The local BYOK web front door (`forged ui`, doc 25). Optional so the CLI stays lean.
ui = [
    "gradio>=5.0,<6",
]
# Drives the UI in a real browser (tests/ui/test_browser_e2e.py; needs
# `playwright install chromium`). Skipped when absent, so CI does not need it.
e2e = [
    "playwright>=1.45",
]

[project.scripts]
forged = "forged.cli:main"

# Discover every forged.* package: the hand-kept list omitted forged.curriculum, which
# broke any non-editable install (e.g. a wheel) at import time.
[tool.setuptools.packages.find]
include = ["forged*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (no I/O, no LLM)",
    "integration: tests that integrate multiple modules",
    "live: opts out of the no-billable-calls guard; may reach a real, paid LLM API",
    "e2e: drives the UI in a real browser (needs the e2e extra + a Playwright browser)",
]

[tool.ruff]
line-length = 100
target-version = "py310"   # matches requires-python
# Generated run output (LLM-authored notebooks, executed copies) is not source
# code — keep it out of linting even when ruff is run bare at the repo root.
# tests/corpus holds a captured run kept as a regression fixture (Lane 1 harness).
extend-exclude = ["runs", "e2e-runs", "test-e2e*", "tests/corpus"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear,
# C4: comprehensions, SIM: simplify. A pragmatic set, not the kitchen sink.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["forged"]
warn_unused_ignores = true
