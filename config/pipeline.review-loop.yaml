# Closed-loop pipeline: builds a lesson, critiques it from the learner's POV, then
# lets the orchestrator iterate on the current best notebook until it is good enough
# or the revision budget runs out.
#
#   brief    \
#   profile  -> planner -> code_author -> executor -> student -> reviewer
#
# The revision loop itself lives under `revision:` so the orchestrator can build
# as many revise/re-run/re-critique rounds as the policy allows.

name: review-loop

# Ceilings are max_completion_tokens for OpenAI, and reasoning tokens count against
# them — so a reasoning model can spend the whole budget before emitting any text. The
# 2026-08-13 run measured planner 4,208 / student ~5,135 / reviewer ~5,592 tokens per call
# against a 4096 ceiling; the reviewer was truncated to empty and its critique lost
# (doc 20, C4). A ceiling is a cap, not a target: raising it prevents truncation without
# raising spend. forged/llm.py retries once at 2x if a response is still truncated to empty.
defaults:
  provider: openai
  model: gpt-5-mini
  max_tokens: 8192

stage_models:
  planner:
    provider: openai
    model: gpt-5-mini
    max_tokens: 8192
  code_author:
    provider: openai
    model: gpt-5
    max_tokens: 16384
  student:
    provider: openai
    model: gpt-5-mini
    max_tokens: 8192
  reviewer:
    provider: openai
    model: gpt-5-mini
    max_tokens: 8192
  reviser:
    provider: openai
    model: gpt-5
    max_tokens: 16384

stages:
  - name: planner
    type: llm
    persona: planner.md
    inputs: [brief, profile]
    output: lesson_plan
    output_kind: text

  - name: code_author
    type: llm
    persona: code_author.md
    inputs: [lesson_plan, profile]
    output: notebook
    output_kind: notebook

  - name: executor
    type: executor
    inputs: [notebook]
    output: execution_report
    params: {timeout: 120, kernel: python3}

  - name: student
    type: llm
    persona: student.md
    inputs: [notebook, execution_report, profile]
    output: student_feedback
    output_kind: text

  - name: reviewer
    type: llm
    persona: reviewer.md
    inputs: [notebook, execution_report, profile]
    output: reviewer_feedback
    output_kind: text

revision:
  max_iterations: 3
  min_quality_score: 90
  require_progress: true
  reviser: reviser.md
  critics:
    - student.md
    - reviewer.md
  executor_params:
    timeout: 120
    kernel: python3
